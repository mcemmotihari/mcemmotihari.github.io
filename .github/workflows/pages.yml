name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build timetable.json from CSV
        run: python3 scripts/build_json.py

      - name: Sanity checks
        run: |
          python3 - <<'PY'
          import csv, json, sys
          from pathlib import Path

          data = Path("data")
          required = [
              "meta.yaml",
              "sections.csv",
              "subjects.csv",
              "faculties.csv",
              "rooms.csv",
              "offerings.csv",
              "slots.csv",
              "timetable.json",
          ]
          missing = [f for f in required if not (data / f).exists()]
          if missing:
              sys.exit(f"Missing files: {missing}")

          for name in ["sections", "subjects", "faculties", "rooms", "offerings", "slots"]:
              with (data / f"{name}.csv").open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if name == "slots" and not rows:
                  sys.exit("slots.csv has no rows")
              print(f"{name}.csv: {len(rows)} rows")

          payload = json.loads((data / "timetable.json").read_text(encoding="utf-8"))
          for key in ["meta", "sections", "slots", "derived"]:
              if key not in payload:
                  sys.exit(f"timetable.json missing key: {key}")
          print(f"timetable.json: {len(payload['slots'])} slots OK")
          PY

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        env:
          VITE_STAFF_PIN_HASH: ${{ secrets.STAFF_PIN_HASH }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/brand/mce-logo.webp
          grep -q '/assets/' dist/index.html
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "dist/index.html still points at source JSX"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

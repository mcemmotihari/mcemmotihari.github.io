<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MCE Motihari</title>
    <link rel="icon" type="image/webp" href="/brand/mce-logo.webp" />
    <meta
      name="description"
      content="Motihari College of Engineering, Motihari — un-official campus site (under development)."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("mce-theme") === "dark" ? "dark" : "light"
      );
    </script>
    <script type="module" crossorigin src="/assets/index-CAL0JvAc.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-DuPP2JWK.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          if (window.__MCE_APP__) return;
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<section style="min-height:100vh;display:grid;place-items:center;padding:2rem;font-family:Outfit,sans-serif;text-align:center">' +
            '<img src="/brand/mce-logo.webp" width="180" height="180" alt="Motihari College of Engineering emblem" style="border-radius:50%;box-shadow:0 18px 40px rgba(22,48,40,.18)"/>' +
            '<p style="letter-spacing:.28em;text-transform:uppercase;color:#5c6478;font-size:.72rem;font-weight:700">Government of Bihar</p>' +
            '<h1 style="font-family:Fraunces,Georgia,serif;font-size:clamp(2rem,6vw,3.4rem);line-height:1;margin:.4rem 0 0;color:#1a1f2e">Motihari College of Engineering</h1>' +
            '<p style="color:#5c6478;font-weight:600">Motihari · East Champaran · Bihar</p>' +
            '<p style="display:inline-block;margin-top:1rem;padding:.5rem 1rem;border-radius:999px;background:#e8edf5;color:#1e3a5f;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.78rem">Under development</p>' +
            "</section>";
        }, 1200);
      });
    </script>
  </body>
</html>

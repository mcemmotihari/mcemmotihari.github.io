name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build timetable.json from CSV
        run: python3 scripts/build_json.py

      - name: Sanity checks
        run: |
          python3 - <<'PY'
          import csv, json, sys
          from pathlib import Path

          data = Path("data")
          required = [
              "meta.yaml",
              "sections.csv",
              "subjects.csv",
              "faculties.csv",
              "rooms.csv",
              "timetable.json",
          ]
          missing = [f for f in required if not (data / f).exists()]
          if missing:
              sys.exit(f"Missing files: {missing}")

          with (data / "sections.csv").open(newline="", encoding="utf-8") as f:
              sections = list(csv.DictReader(f))
          if not sections:
              sys.exit("sections.csv has no rows")

          for name in ["subjects", "faculties", "rooms"]:
              with (data / f"{name}.csv").open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              print(f"{name}.csv: {len(rows)} rows")

          active = [s for s in sections if str(s.get("status") or "active").strip().lower() == "active"]
          slot_total = 0
          for sec in active:
              sid = sec["id"]
              slot_path = data / "schedules" / sid / "slots.csv"
              off_path = data / "schedules" / sid / "offerings.csv"
              if not slot_path.exists():
                  sys.exit(f"Active section {sid} missing {slot_path}")
              with slot_path.open(newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  sys.exit(f"{slot_path} has no rows")
              slot_total += len(rows)
              if off_path.exists():
                  with off_path.open(newline="", encoding="utf-8") as f:
                      print(f"{sid}: {len(rows)} slots, {len(list(csv.DictReader(f)))} offerings")
              else:
                  print(f"{sid}: {len(rows)} slots")
          if slot_total == 0:
              sys.exit("No slots found for active sections")

          payload = json.loads((data / "timetable.json").read_text(encoding="utf-8"))
          for key in ["meta", "sections", "slots", "derived"]:
              if key not in payload:
                  sys.exit(f"timetable.json missing key: {key}")
          print(f"timetable.json: {len(payload['slots'])} slots OK, {len(active)} active sections")
          PY

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        env:
          VITE_STAFF_PIN_HASH: ${{ secrets.STAFF_PIN_HASH }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/brand/mce-logo.webp
          grep -q '/assets/' dist/index.html
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "dist/index.html still points at source JSX"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
